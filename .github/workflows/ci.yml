name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish a release as, e.g. v0.2.0. Leave blank to just build."
        required: false
        default: ""
      deb_revision:
        description: "Debian revision for the built .deb. Blank = run number. Use 3 to match the store submission."
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # evdev is device-only; the tests deliberately do not need it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Render smoke frames
        run: python app.py --smoke frames

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: frames/

  package:
    runs-on: ubuntu-latest
    needs: test
    # Needed by `gh release create`; repos default to a read-only GITHUB_TOKEN,
    # which fails the release step with a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install Pillow

      - name: Build .deb
        # The run number keeps ordinary CI builds unique, but a release needs a
        # revision you choose, so the asset matches what was published elsewhere.
        env:
          REQUESTED_REVISION: ${{ inputs.deb_revision }}
        run: |
          set -euo pipefail
          chmod +x packaging/build-deb.sh
          revision="${REQUESTED_REVISION:-}"
          [ -n "$revision" ] || revision="${GITHUB_RUN_NUMBER}"
          echo "Building with Debian revision: $revision"
          DEB_REVISION="$revision" packaging/build-deb.sh

      - name: Verify package installs cleanly
        # Cheap sanity check that the archive is well formed and the paths
        # match the APPLaunch layout the launcher expects.
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q 'usr/share/APPLaunch/apps/cardputerzero-radio/app.py'
          dpkg-deb --contents "$deb" | grep -q 'usr/share/APPLaunch/bin/cardputerzero-radio'
          dpkg-deb --contents "$deb" | grep -q 'usr/share/APPLaunch/applications/cardputerzero-radio.desktop'

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      # Runs either on a v* tag push, or from the Actions tab by supplying
      # release_tag — the manual path exists because some environments cannot
      # push tags, and the release should not depend on that.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb --clobber
          else
            gh release create "$TAG" dist/*.deb \
              --target "${GITHUB_SHA}" \
              --title "CardputerZero Radio $TAG" \
              --generate-notes
          fi
          echo "Published $TAG with $(ls dist/*.deb)"
